[package]
name = "alice-fbx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
alice-fbx = { path = ".." }

[[bin]]
name = "fuzz_read_tree"
path = "fuzz_targets/fuzz_read_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_read_tree_versioned"
path = "fuzz_targets/fuzz_read_tree_versioned.rs"
test = false
doc = false
bench = false

# its own workspace (cargo-fuzz builds it with nightly)
[workspace]
